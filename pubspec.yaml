name: crimson_catalogue_studio
description: Crimson Decore catalogue app rebuilt in Flutter with the existing catalogue rules preserved.
publish_to: "none"
version: 1.3.35+110

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  archive: ^3.6.1
  flutter:
    sdk: flutter
  local_auth: ^2.3.0
  xml: ^6.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/crimson_decore_mark.png
    - assets/branding/crimson_wordmark.png
    - assets/config/crimson_cloud_config.json
    - shorebird.yaml































